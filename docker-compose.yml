services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paragraf
      POSTGRES_PASSWORD: paragraf
      POSTGRES_DB: paragraf
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paragraf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
