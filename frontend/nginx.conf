# Serves the built frontend and proxies /api to the backend container (portable bundle).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Same policy as vercel.json; the API is same-origin here, so connect-src stays 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 64k;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # Appends the client's address: the backend takes the right-most entry
        # (TRUSTED_PROXY_HOPS=1), so a forged header from the browser is ignored.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        # Server-sent events: stream every chunk as it arrives.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
