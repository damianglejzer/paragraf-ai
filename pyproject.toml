[project]
name = "paragraf"
version = "0.1.0"
description = "Paragraf AI - Polish law assistant with verified citations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "tenacity>=9.0",
    "spacy>=3.8.16",
    "pl-core-news-sm",
    "google-genai>=2.31.0",
    "rapidfuzz>=3.14.6",
    "langgraph>=1.2.16",
    "mcp>=2.3.0",
    "fastapi>=0.143.5",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.5.0",
    "langfuse>=5.0.2",
    "openai>=3.42.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/paragraf"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Polish text contains "ambiguous" unicode characters

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["paragraf"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = ["integration: needs a running Postgres or network"]
addopts = "-m 'not integration'"

[tool.uv.sources]
pl-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/pl_core_news_sm-3.8.0/pl_core_news_sm-3.8.0-py3-none-any.whl" }
